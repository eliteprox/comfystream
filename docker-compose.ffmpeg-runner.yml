# Local ffmpeg tools on the blueclaw orchestrator network.
# Streaming: comfystream/ffmpeg-live (persistent, port 8740 inside the container).
# Batch: comfystream/ffmpeg-<tool> single-shot routes on port 8994.
#
#   LIVEPEER_ORCH_SECRET=... docker compose -f docker-compose.ffmpeg-runner.yml up -d --build

services:
  ffmpeg-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.ffmpeg-runner
    image: comfystream-ffmpeg-runner:latest
    container_name: ffmpeg-runner
    restart: unless-stopped
    environment:
      LIVEPEER_ORCH_URL: ${LIVEPEER_ORCH_URL:-https://hky.eliteencoder.net:8936}
      LIVEPEER_ORCH_SECRET: ${LIVEPEER_ORCH_SECRET:?set LIVEPEER_ORCH_SECRET}
      LIVEPEER_RUNNER_URL: ${LIVEPEER_RUNNER_URL:-http://ffmpeg-runner:8994}
      FFMPEG_RUNNER_PORT: "8994"
    command:
      - --host=0.0.0.0
      - --port=8994
      - --runner-url=${LIVEPEER_RUNNER_URL:-http://ffmpeg-runner:8994}
      - --orchestrator=${LIVEPEER_ORCH_URL:-https://hky.eliteencoder.net:8936}
    networks:
      - blueclaw

networks:
  blueclaw:
    external: true
    name: blueclaw-stack_default
