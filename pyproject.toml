[build-system]
requires = ["setuptools>=64.0.0,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfystream"
description = "Build Live AI Video with ComfyUI"
version = "0.1.8"
license = { file = "LICENSE" }
dependencies = [
    "asyncio",
    "setuptools>=70,<81",
    "stream-pack @ git+https://github.com/livepeer/ComfyUI-Stream-Pack.git@7a21d1a1cfce6209e6d26b4737a0eaeb8def3144",
    "comfyui @ git+https://github.com/eliteprox/forks-pip-and-uv-installable-ComfyUI.git@024eb6c50d50fc3c881336bc06628508ada63c18",
    "aiortc",
    "aiohttp",
    "aiohttp_cors",
    "toml",
    "twilio",
    "prometheus_client",
    "librosa"
]

[project.optional-dependencies]
capabilities = ["jsonschema>=4.23,<5"]
media = ["stream-pack[media,language] @ git+https://github.com/livepeer/ComfyUI-Stream-Pack.git@7a21d1a1cfce6209e6d26b4737a0eaeb8def3144"]
chat = ["stream-pack[chat] @ git+https://github.com/livepeer/ComfyUI-Stream-Pack.git@7a21d1a1cfce6209e6d26b4737a0eaeb8def3144"]
ffmpeg = ["livepeer-swarm-publish @ git+https://github.com/eliteprox/runner-app-examples.git@af13cd58a4d6e6fd6360ec898df0ae252284b6e5#subdirectory=packages/swarm-publish"]
dev = ["pytest", "pytest-cov", "ruff"]
server = [
    "pytrickle @ git+https://github.com/livepeer/pytrickle.git@v0.1.8"
]
live-runner = [
    "nvidia-ml-py>=12",
    "livepeer-gateway @ git+https://github.com/eliteprox/livepeer-python-gateway.git@796ca2dc833ef3c5981260c50d948639640f2895",
    "av",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/yondonfu/comfystream"

[project.scripts]
comfystream-live-runner = "comfystream.server.live_runner:main"
comfystream-ffmpeg-runner = "comfystream.server.ffmpeg_runner:main"

[tool.setuptools.package-data]
comfystream = ["assets/**/*.json", "assets/**/*.yaml", "assets/**/*.yml"]

[tool.comfy]
PublisherId = "livepeer-comfystream"
DisplayName = "ComfyStream"
Icon = "https://raw.githubusercontent.com/livepeer/comfystream-docs/main/logo/icon-light-120px.svg" # SVG, PNG, JPG or GIF (MAX. 800x400px)

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["comfystream_ffmpeg_paths"]
packages = {find = {where = ["src", "nodes"]}}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # let the formatter handle long lines
    "E402",  # module level import not at top (required for ComfyUI)
    "E722",  # bare except (existing code patterns)
    "F401",  # imported but unused (many re-exports)
    "F403",  # star imports (ComfyUI pattern)
    "F405",  # may be undefined from star imports
    "F841",  # assigned but never used (temporary)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
